<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>preview 390</title>
<style>html,body{margin:0;padding:0;background:#ffffff}iframe{display:block;border:0;width:390px;height:844px}</style>
</head><body>
<iframe id="f" src="/preview.html"></iframe>
<script>
const p = new URLSearchParams(location.search);
const sel = p.get('sel');
const dy = parseInt(p.get('dy') || '0', 10);
const f = document.getElementById('f');
f.addEventListener('load', function () {
  if (!sel) return;
  const d = f.contentWindow.document, w = f.contentWindow;
  const el = d.querySelector(sel);
  if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY + dy);
});
</script>
</body></html>
